[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robodata"
version = "0.1.0"
description = "Multimodal robot-learning dataset pipeline: record, sync, validate, curate, package (real + sim) into LeRobot-format datasets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "zarr>=3.0",
    "h5py>=3.10",
    "av>=12",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "pyyaml>=6",
    "pydantic>=2.5",
    "matplotlib>=3.8",
    "huggingface_hub>=0.24",
    "imagehash>=4.3",
    "tqdm>=4.66",
    "tabulate>=0.9",
]

[project.optional-dependencies]
sim = ["mujoco>=3.2"]
lerobot = ["lerobot[dataset,training]>=0.6"]
dev = ["pytest>=8"]
versioning = ["dvc>=3"]
all = ["robodata[sim,lerobot,dev,versioning]"]

[project.scripts]
robodata = "robodata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
